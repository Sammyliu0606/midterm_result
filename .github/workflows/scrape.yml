name: Scrape MD election results

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 minutes, offset from :00 (UTC; GitHub may delay runs)
  workflow_dispatch:             # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Set SBE_BASE_URL under Settings > Secrets and variables > Actions > Variables
      # once SBE confirms the 2026 address. Must end with a slash.
      - name: Scrape
        run: |
          python scrape.py \
            --base-url "${{ vars.SBE_BASE_URL }}" \
            --out data/2026 \
            --baseline data/2022/master/gov_county.csv

      - name: Commit if data changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/2026
          if git diff --cached --quiet; then
            echo "No change since last run."
          else
            git commit -m "Results update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
